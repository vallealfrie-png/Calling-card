<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Criseld C. Valle | Digital Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap');

        body {
            background-color: #f4f1ea;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            font-family: 'Inter', sans-serif;
        }

        /* --- Logo Styles --- */
        .company-logo-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .company-logo-container img {
            width: 180px; /* Adjusted for the new logo shape */
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.1));
        }

        /* --- Profile Card Styles --- */
        .card {
            width: 280px;
            height: 280px;
            background: white;
            border-radius: 32px;
            padding: 3px;
            position: relative;
            box-shadow: #2c3e5030 0px 70px 30px -50px;
            transition: all 0.5s ease-in-out;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid #e0d8c3;
        }

        .card .mail {
            position: absolute;
            right: 1.5rem;
            top: 1.4rem;
            z-index: 10;
            text-decoration: none;
            color: #bfa36a; /* Gold tone from logo */
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }

        .card .mail:hover {
            transform: scale(1.2);
        }

        .card .profile-pic {
            position: absolute;
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            top: 3px;
            left: 3px;
            border-radius: 29px;
            z-index: 1;
            overflow: hidden;
            transition: all 0.5s ease-in-out 0.2s;
        }

        .card .profile-pic img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            object-position: center 15%; 
            transition: all 0.5s ease-in-out 0s;
        }

        .card .bottom {
            position: absolute;
            bottom: 3px;
            left: 3px;
            right: 3px;
            background: #1a1a1a; /* Dark sleek black from logo */
            top: 82%; 
            border-radius: 29px;
            z-index: 2;
            box-shadow: rgba(0, 0, 0, 0.4) 0px 5px 15px 0px inset;
            transition: all 0.5s cubic-bezier(0.645, 0.045, 0.355, 1) 0s;
            display: flex;
            flex-direction: column;
        }

        .card .bottom .content {
            padding: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, transform 0.5s ease-in-out;
            pointer-events: none;
        }

        .card .bottom .content .name {
            display: block;
            font-size: 1.15rem;
            color: #d4af37; /* Metallic Gold */
            font-family: 'Playfair Display', serif;
            font-weight: bold;
        }

        .card .bottom .content .position-label {
            display: block;
            font-size: 0.7rem;
            color: #f4f1ea;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .bottom .content .about-me {
            display: block;
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .card .bottom .bottom-bottom {
            position: absolute;
            bottom: 12px;
            left: 1.2rem;
            right: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
        }

        .social-links-container {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-links-container a {
            color: #f4f1ea;
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-links-container a:hover {
            color: #d4af37;
            transform: translateY(-3px);
        }

        .card .bottom .bottom-bottom .button {
            background: #d4af37;
            color: #1a1a1a; 
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.7rem;
            padding: 0.5rem 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .card .bottom .bottom-bottom .button:hover {
            background: #f4f1ea;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* --- Hover States --- */
        .card:hover .bottom {
            top: 18%; 
            border-radius: 60px 29px 29px 29px;
        }

        .card:hover .bottom .content {
            opacity: 1;
            transform: translateY(55px); 
            pointer-events: auto;
        }

        .card:hover .profile-pic {
            width: 100px;
            height: 100px;
            top: 12px;
            left: 12px;
            border-radius: 50%;
            z-index: 3;
            border: 4px solid #d4af37; 
        }

        /* --- Typing Animation --- */
        .wrapper { text-align: center; }
        .title { font-size: 1.2rem; font-weight: 700; color: #1a1a1a; letter-spacing: 0.5px; }
        .title span:after {
            content: 'Finance & Admin Expert';
            animation: words 12s infinite;
        }

        @keyframes words {
            0%, 25% { content: 'Financial Management'; color: #bfa36a; }
            26%, 50% { content: 'Reporting & Analytics'; color: #1a1a1a; }
            51%, 75% { content: 'Inventory Audit'; color: #bfa36a; }
            76%, 100% { content: 'Records Management'; color: #1a1a1a; }
        }
    </style>
</head>
<body>

    <div class="company-logo-container">
        <img src="https://i.imgur.com/dwYNrWC.jpeg" alt="Valle Logo">
    </div>

    <div class="card">
        <a href="mailto:anacriseldavalle12@gmail.com" class="mail">
            <i class="fa-solid fa-envelope"></i>
        </a>

        <div class="profile-pic">
            <img src="https://i.imgur.com/6QClBIG.png" alt="Ana Criseld C. Valle">
        </div>

        <div class="bottom">
            <div class="content">
                <span class="name">Ana Criseld C. Valle</span>
                <span class="position-label">Professional Partner</span>
                <span class="about-me">
                    Specializing in Financial Management, Collections, and Inventory Audits. Expert in consolidating accounts and streamlining administrative workflows.
                </span>
            </div>

            <div class="bottom-bottom">
                <div class="social-links-container">
                    <a href="https://www.facebook.com/share/1HAwZWyxC5/" target="_blank">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="viber://chat?number=%2B639815718589">
                        <i class="fa-brands fa-viber"></i>
                    </a>
                </div>
                <a href="tel:+639815718589" class="button">Contact Me</a>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <h1 class="title">
            Your Dedicated
            <span></span>
        </h1>
    </div>

</body>
</html>
